name: Build Windows installer

on:
  push:
    branches: [main, "feature/**"]
    paths:
      - "src/**"
      - "installer/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore src/DeviceTrayHub/DeviceTrayHub.csproj

      - name: Build
        run: dotnet build src/DeviceTrayHub/DeviceTrayHub.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/DeviceTrayHub.Tests/DeviceTrayHub.Tests.csproj --configuration Release

      - name: Publish self-contained x64
        run: >
          dotnet publish src/DeviceTrayHub/DeviceTrayHub.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/publish
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: cmd
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\DeviceTrayHub.iss'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: German-Device-Tray-Hub-Setup
          path: artifacts/installer/*.exe
          if-no-files-found: error